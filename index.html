<style>
  :root{ --ink:#f4ead2; --amber:#f2b134; --amber-dk:#7a3d00; --panel:#1a0f2e; --line:#4a2c72; }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:radial-gradient(1100px 700px at 50% 20%, #34195f 0%, #1a0d34 55%, #0c0518 100%);
    color:var(--ink); font-family:"VT323",ui-monospace,monospace;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:20px; padding-block:26px;
  }
  .card{ width:100%; max-width:600px; background:var(--panel);
    border:3px solid var(--line); border-radius:18px; overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.6); }
  .cover{ display:block; width:100%; height:auto; max-height:72vh; object-fit:contain; background:#0c0518; }
  .bar{ padding:16px 18px 18px; background:linear-gradient(180deg,#22143a,#160c28); }
  form{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  input[type=password]{ flex:1 1 240px; min-width:0; font-family:"VT323",monospace; font-size:26px;
    color:#fff; background:#100a1e; border:2px solid var(--line); border-radius:10px;
    padding:12px 16px; letter-spacing:3px; text-align:center; }
  input[type=password]::placeholder{ color:#7a6aa0; letter-spacing:2px; }
  input[type=password]:focus{ outline:none; border-color:var(--amber); box-shadow:0 0 0 3px rgba(242,177,52,.28); }
  button{ font-family:"Luckiest Guy",cursive; font-size:24px; color:#3a1c00; letter-spacing:1px;
    background:linear-gradient(180deg,#ffd873,#f2b134); border:none; border-radius:10px;
    padding:8px 26px; cursor:pointer; box-shadow:0 5px 0 var(--amber-dk); }
  button:active{ transform:translateY(2px); box-shadow:0 3px 0 var(--amber-dk); }
  button:disabled{ opacity:.6; cursor:progress; }
  .msg{ min-height:22px; text-align:center; font-size:21px; margin-top:12px; letter-spacing:.5px; }
  .msg.err{ color:#ff8b82; }
  .msg.ok{ color:#7fe0a6; }
  .hint{ text-align:center; font-size:16px; color:#8f7cb6; margin:12px 4px 2px; line-height:1.5; }
</style>

function b64d(s){ const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }

async function decrypt(pw){
  const enc=new TextEncoder();
  const keyMat=await crypto.subtle.importKey('raw', enc.encode(pw), {name:'PBKDF2'}, false, ['deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64d(SALT), iterations:ITER, hash:'SHA-256'},
    keyMat, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(IV)}, key, b64d(CT));
  return new TextDecoder().decode(plain);
}

const f=document.getElementById('f'), pw=document.getElementById('pw'),
      go=document.getElementById('go'), msg=document.getElementById('msg');

f.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const p=pw.value;
  if(!p){ pw.focus(); return; }
  go.disabled=true; msg.className='msg'; msg.textContent='Unlocking…';
  try{
    const html=await decrypt(p);
    msg.className='msg ok'; msg.textContent='Welcome. Loading…';
    setTimeout(()=>{ document.open(); document.write(html); document.close(); }, 220);
  }catch(err){
    go.disabled=false; msg.className='msg err'; msg.textContent='Wrong password — try again.';
    pw.select();
  }
});
